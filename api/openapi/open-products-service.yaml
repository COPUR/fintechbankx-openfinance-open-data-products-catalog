openapi: 3.0.3
info:
  title: Open Products Catalog Service API
  version: 0.1.0
  description: Public API to list financial products.
servers:
  - url: https://api.example.com/open-finance/v1
paths:
  /products:
    get:
      summary: List products
      security: []
      operationId: listProducts
      tags:
        - Products
      parameters:
        - $ref: '#/components/parameters/InteractionId'
        - $ref: '#/components/parameters/AuthorizationOptional'
        - $ref: '#/components/parameters/Type'
        - $ref: '#/components/parameters/Segment'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Product list
          headers:
            X-FAPI-Interaction-ID:
              schema:
                type: string
            X-OF-Cache:
              schema:
                type: string
            ETag:
              schema:
                type: string
            Cache-Control:
              description: >-
                no-cache. The response echoes the caller's X-FAPI-Interaction-ID, so
                caches must revalidate every reuse with If-None-Match (cheap 304).
              schema:
                type: string
                example: no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '304':
          description: Not modified
          headers:
            X-FAPI-Interaction-ID:
              schema:
                type: string
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
        '400':
          description: >-
            Invalid request: X-FAPI-Interaction-ID missing, or a type/segment
            filter that does not match ^[A-Z0-9_-]{2,30}$ once upper-cased.
          headers:
            X-FAPI-Interaction-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: >-
            Too many requests. Returned by the API gateway's rate limit (a token
            bucket of 100 refilled at 50 per second, per gateway pod), not by the
            service; retry after the number of seconds in Retry-After.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
                minimum: 0
            x-fbx-rate-limited:
              description: Set to true by the gateway when it rejected the request for its rate limit.
              schema:
                type: string
                enum:
                  - 'true'
components:
  parameters:
    InteractionId:
      name: X-FAPI-Interaction-ID
      in: header
      required: true
      schema:
        type: string
    AuthorizationOptional:
      name: Authorization
      in: header
      required: false
      schema:
        type: string
    Type:
      name: type
      in: query
      required: false
      description: >-
        Product type code, matched case-insensitively. Must match
        ^[A-Z0-9_-]{2,30}$ once trimmed and upper-cased (2 to 30 ASCII letters,
        digits, underscores or hyphens); anything else is rejected with 400.
        Blank means no filter.
      schema:
        type: string
        maxLength: 30
    Segment:
      name: segment
      in: query
      required: false
      description: >-
        Product segment code, matched case-insensitively. Must match
        ^[A-Z0-9_-]{2,30}$ once trimmed and upper-cased (2 to 30 ASCII letters,
        digits, underscores or hyphens); anything else is rejected with 400.
        Blank means no filter.
      schema:
        type: string
        maxLength: 30
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
  schemas:
    ProductListResponse:
      type: object
      properties:
        Data:
          type: object
          properties:
            Product:
              type: array
              items:
                $ref: '#/components/schemas/Product'
        Links:
          type: object
          properties:
            Self:
              type: string
              description: Relative link to this result, e.g. /open-finance/v1/products?type=PCA
              example: /open-finance/v1/products?type=PCA
        Meta:
          type: object
          properties:
            TotalRecords:
              type: integer
    Product:
      type: object
      properties:
        ProductId:
          type: string
        Name:
          type: string
        Type:
          type: string
        Segment:
          type: string
        Currency:
          type: string
        MonthlyFee:
          type: string
        AnnualRate:
          type: string
        UpdatedAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        interactionId:
          type: string
        timestamp:
          type: string
          format: date-time
