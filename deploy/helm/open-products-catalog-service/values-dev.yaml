# Dev: smaller footprint, still two replicas so rollouts and PDBs are exercised.
# The sample catalogue is loaded by Flyway (classpath:db/seed).
replicaCount: 2
autoscaling:
  minReplicas: 2
  maxReplicas: 3
podDisruptionBudget:
  minAvailable: 1
resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 512Mi
config:
  OPEN_PRODUCTS_SEED_ENABLED: "true"
  TRACING_SAMPLING_PROBABILITY: "1.0"
topologySpread:
  maxSkew: 2
