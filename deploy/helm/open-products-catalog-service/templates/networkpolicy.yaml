{{- if .Values.networkPolicy.enabled }}
{{- if not .Values.networkPolicy.databaseCidrs }}
{{- fail "networkPolicy.databaseCidrs is required: the Aurora subnets' CIDRs (PostgreSQL egress is never open to any destination)" }}
{{- end }}
{{- range .Values.networkPolicy.databaseCidrs }}
{{- if hasSuffix "/0" (toString . | trim) }}
{{- fail (printf "networkPolicy.databaseCidrs entry %q must not end in /0: list the Aurora subnets' CIDRs only" (toString .)) }}
{{- end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "products.name" . }}
  namespace: {{ include "products.namespace" . }}
  labels:
    {{- include "products.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "products.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # API traffic only through the gateway.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.gatewayNamespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
    # Prometheus scrapes the management port.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.observabilityNamespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.managementPort }}
    {{- if .Values.mesh.sidecarInject }}
    # Istio sidecar: kubelet probes are rewritten to the agent on 15020 and
    # sidecar readiness is on 15021. Probes come from the node, which no
    # namespace selector matches, so these ports are open to the cluster.
    - ports:
        - protocol: TCP
          port: 15020
        - protocol: TCP
          port: 15021
    {{- end }}
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Aurora PostgreSQL, only to the cluster's subnets
    - ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.databasePort }}
      to:
        {{- range .Values.networkPolicy.databaseCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
    # OTLP traces to the platform collector
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.observabilityNamespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.otlpPort }}
    # Istio sidecar control plane (xDS, certificates)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - protocol: TCP
          port: 15012
{{- end }}
