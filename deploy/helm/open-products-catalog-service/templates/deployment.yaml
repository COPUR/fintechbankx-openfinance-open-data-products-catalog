{{- /*
Platform datasource/TLS guard, vendored unchanged as _fbx_helpers.tpl (source, commit, path and sha256 in
its header; platform chart README, "Vendoring the guard"). The adapter maps every
value of this chart that feeds one of the guard's routes; a key left out is never checked:
- config: .Values.config (ConfigMap, envFrom of the migrate init container, the service and
  the history guard check pods).
- extraEnv: .Values.extraEnv as a list ({name, value} entries; the map form is converted),
  refused whole by configmap.yaml since the chart renders none. No env value of the
  templates is interpolated from values (all literals or secretKeyRefs), so there is nothing
  else to pass. SPRING_PROFILES_ACTIVE (aws) and FBX_DEPLOYED are chart-rendered literals
  and are not passed: the guard refuses every spring.profiles.* name it is given.
- envFrom, extraEnvFrom: no such values; mapped so that a value set there (which no template
  renders) is refused rather than ignored.
- javaToolOptions: the chart has no such value and renders none; a value set there is refused
  below. JVM options can only come from config.*, where the guard checks JAVA_TOOL_OPTIONS,
  JDK_JAVA_OPTIONS and _JAVA_OPTIONS.
- externalSecret.data / extraData as values: the chart renders its own entries only; a value
  set there is refused below rather than ignored.
- databaseCa: databaseCaBundle, always mounted (enabled), so DB_URL must carry
  sslrootcert=<mountPath>/<key>.
- kafka.runtime: "" (the service has no Kafka client; a Kafka protocol key in config then
  fails the render).
- externalSecret: data = the entries externalsecret.yaml renders (db and db-migration),
  dataFrom = any dataFrom it renders plus .Values.externalSecret.dataFrom (refused).
*/ -}}
{{- $extraEnv := list -}}
{{- if kindIs "map" .Values.extraEnv -}}
{{- range $name, $value := .Values.extraEnv -}}
{{- $extraEnv = append $extraEnv (dict "name" $name "value" (toString $value)) -}}
{{- end -}}
{{- else -}}
{{- $extraEnv = .Values.extraEnv | default list -}}
{{- end -}}
{{- $secrets := fromYaml (include "products.renderedSecretData" (dict "root" . "template" "externalsecret.yaml")) -}}
{{- if .Values.javaToolOptions -}}
{{- fail "javaToolOptions is not supported by this chart (it renders no JAVA_TOOL_OPTIONS of its own); set config.JAVA_TOOL_OPTIONS, which the guard checks" -}}
{{- end -}}
{{- range $k := list "data" "extraData" -}}
{{- if index ($.Values.externalSecret | default dict) $k -}}
{{- fail (printf "externalSecret.%s is not supported by this chart: it renders its own ExternalSecret entries (templates/externalsecret.yaml), which the guard checks" $k) -}}
{{- end -}}
{{- end -}}
{{- include "fbx.guard" (dict "Values" (dict
      "config" .Values.config
      "extraEnv" $extraEnv
      "envFrom" .Values.envFrom
      "extraEnvFrom" .Values.extraEnvFrom
      "javaToolOptions" ""
      "databaseCa" (dict "enabled" true "mountPath" .Values.databaseCaBundle.mountPath "key" .Values.databaseCaBundle.key)
      "kafka" (dict "runtime" "")
      "externalSecret" (dict "enabled" true "data" ($secrets.data | default list)
        "dataFrom" (concat ($secrets.dataFrom | default list) (.Values.externalSecret.dataFrom | default list))))) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "products.name" . }}
  namespace: {{ include "products.namespace" . }}
  labels:
    {{- include "products.labels" . | nindent 4 }}
  {{- with .Values.historyGuardCheck.breakGlassTicket }}
  annotations:
    # Break-glass release: the pre-upgrade history guard gate was skipped (runbook section 2.3).
    fintechbankx.io/history-guard-break-glass: {{ . | quote }}
  {{- end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount | int }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "products.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "products.selectorLabels" . | nindent 8 }}
        {{- toYaml .Values.podLabels | nindent 8 }}
        version: {{ .Values.image.tag | quote }}
        sidecar.istio.io/inject: {{ .Values.mesh.sidecarInject | quote }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        # Restarts pods when the secret mapping changes, and on the next
        # upgrade after a credential rotation (lookup reads the synced Secrets'
        # data; it is empty under helm template/lint).
        checksum/secret: {{ printf "%s%v%v" (include (print $.Template.BasePath "/externalsecret.yaml") .) (lookup "v1" "Secret" (include "products.namespace" .) (include "products.dbSecretName" .)).data (lookup "v1" "Secret" (include "products.namespace" .) (include "products.migrationSecretName" .)).data | sha256sum }}
        {{- if .Values.mesh.sidecarInject }}
        # Aurora is outside the mesh (PostgreSQL TLS end to end); without this the
        # migrate init container, which runs before the sidecar, cannot connect.
        traffic.sidecar.istio.io/excludeOutboundPorts: {{ .Values.networkPolicy.databasePort | quote }}
        {{- end }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.service.managementPort | toString | quote }}
        prometheus.io/path: /actuator/prometheus
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | quote }}
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpread.maxSkew | int }}
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "products.selectorLabels" . | nindent 14 }}
        - maxSkew: {{ .Values.topologySpread.maxSkew | int }}
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "products.selectorLabels" . | nindent 14 }}
      {{- if .Values.externalSecret.enabled }}
      initContainers:
        # Flyway as the schema owner, then exit (OPEN_PRODUCTS_MIGRATE_ONLY).
        # Replicas starting together are serialised by Flyway's lock.
        - name: migrate
          image: {{ printf "%s:%s" (required "image.repository is required" .Values.image.repository) (required "image.tag is required" .Values.image.tag) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          envFrom:
            - configMapRef:
                name: {{ include "products.name" . }}
            - secretRef:
                name: {{ include "products.migrationSecretName" . }}
          env:
            # Startup refuses a database URL without verified TLS (DatabaseTlsEnvironmentPostProcessor).
            - name: SPRING_PROFILES_ACTIVE
              value: aws
            # Chart-owned deployment marker (never from values; config.FBX_DEPLOYED is refused):
            # with it DatabaseTlsEnvironmentPostProcessor is enforced whatever the profiles, and
            # refuses to start without the aws profile or with a local profile.
            - name: FBX_DEPLOYED
              value: "true"
            - name: OPEN_PRODUCTS_MIGRATE_ONLY
              value: "true"
            - name: SPRING_MAIN_WEB_APPLICATION_TYPE
              value: none
            # Hibernate validates the migrated schema with the same owner login.
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "products.migrationSecretName" . }}
                  key: FLYWAY_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "products.migrationSecretName" . }}
                  key: FLYWAY_PASSWORD
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: rds-ca-bundle
              mountPath: {{ .Values.databaseCaBundle.mountPath | quote }}
              readOnly: true
      {{- end }}
      containers:
        - name: open-products-catalog-service
          image: {{ printf "%s:%s" (required "image.repository is required" .Values.image.repository) (required "image.tag is required" .Values.image.tag) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port | int }}
            - name: management
              containerPort: {{ .Values.service.managementPort | int }}
          envFrom:
            - configMapRef:
                name: {{ include "products.name" . }}
            {{- if .Values.externalSecret.enabled }}
            - secretRef:
                name: {{ include "products.dbSecretName" . }}
            {{- end }}
          env:
            # Startup refuses a database URL without verified TLS (DatabaseTlsEnvironmentPostProcessor).
            - name: SPRING_PROFILES_ACTIVE
              value: aws
            # Chart-owned deployment marker (never from values; config.FBX_DEPLOYED is refused):
            # with it DatabaseTlsEnvironmentPostProcessor is enforced whatever the profiles, and
            # refuses to start without the aws profile or with a local profile.
            - name: FBX_DEPLOYED
              value: "true"
            {{- if .Values.externalSecret.enabled }}
            # The schema was migrated by the init container; the runtime role
            # (SELECT on product only) could not run Flyway anyway.
            - name: SPRING_FLYWAY_ENABLED
              value: "false"
            {{- end }}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: rds-ca-bundle
              mountPath: {{ .Values.databaseCaBundle.mountPath | quote }}
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        # Platform trust-manager bundle; JDBC verifies Aurora's certificate with it.
        - name: rds-ca-bundle
          configMap:
            name: {{ .Values.databaseCaBundle.configMapName | quote }}
            items:
              - key: {{ .Values.databaseCaBundle.key | quote }}
                path: {{ .Values.databaseCaBundle.key | quote }}
