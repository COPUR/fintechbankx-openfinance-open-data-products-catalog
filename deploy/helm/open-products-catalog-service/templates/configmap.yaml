{{- /* No Spring config location from values (round 5): an import or location would load
       configuration the chart does not render or check, past every guard here. Keys are
       normalised the way Spring's relaxed binding reads environment variables. A configtree
       is allowed only as a value the chart itself renders on
       optional:configtree:/etc/fintechbankx/config/; this chart renders none. */}}
{{- $denied := "^SPRING_CONFIG_(IMPORT|LOCATION|ADDITIONAL_?LOCATION)(_|$)|^SPRING_APPLICATION_JSON$" }}
{{- $deniedMsg := "is not allowed: the chart sets no Spring config location (spring.config.import, spring.config.location, spring.config.additional-location or SPRING_APPLICATION_JSON); only a chart-rendered optional:configtree:/etc/fintechbankx/config/ would be, and this chart renders none" }}
{{- /* No Spring profile from values (round 6, as in the retail and corporate charts): the startup
       TLS assertion (DatabaseTlsEnvironmentPostProcessor) runs under the aws profile the chart
       renders on every container. config and extraEnv may not set SPRING_PROFILES_* in any
       spelling Spring's relaxed binding reads (case and separators ignored), and the JVM option
       variables JAVA_TOOL_OPTIONS, JDK_JAVA_OPTIONS and JAVA_OPTS may not mention spring.profiles
       in any spelling (one from valueFrom cannot be inspected and is refused).
       SPRING_APPLICATION_JSON is refused above. The assertion has no enforce flag. */}}
{{- $profileMsg := "the startup TLS assertion (DatabaseTlsEnvironmentPostProcessor) runs under the aws profile the chart renders on every container, which values cannot change" }}
{{- /* Nothing in values reaches the datasource around config.DB_URL (round 7, as in the consent,
       payee and atm charts; cicd-templates 13ca2c6 charts/fintechbankx-service/templates/
       _helpers.tpl:105-121): no spring.datasource.*, spring.flyway.*, spring.liquibase.* or
       spring.r2dbc.* key in any spelling (SPRING_DATASOURCE_USERNAME excepted), no key naming a
       JDBC URL, an SSL factory or a host name verifier, no jdbc: value outside config.DB_URL, and
       no JVM option variable (_JAVA_OPTIONS included) that mentions jdbc, ssl, spring, flyway,
       liquibase, datasource, r2dbc or application.json. */}}
{{- $datasourceMsg := "can redirect or override the datasource past the config.DB_URL check (the JDBC URL goes in config.DB_URL; SPRING_DATASOURCE_USERNAME is the only spring.datasource.* key allowed)" }}
{{- $jvmOptions := list "JAVATOOLOPTIONS" "JDKJAVAOPTIONS" "JAVAOPTIONS" "JAVAOPTS" }}
{{- $entries := list }}
{{- range $key, $value := .Values.config }}
{{- $entries = append $entries (dict "where" (printf "config.%s" $key) "name" (toString $key) "value" (toString $value) "literal" true) }}
{{- end }}
{{- $extraEnv := .Values.extraEnv | default list }}
{{- if kindIs "map" $extraEnv }}
{{- range $key, $value := $extraEnv }}
{{- $entries = append $entries (dict "where" (printf "extraEnv.%s" $key) "name" (toString $key) "value" (toString $value) "literal" true) }}
{{- end }}
{{- else }}
{{- range $entry := $extraEnv }}
{{- if kindIs "map" $entry }}
{{- $name := toString (get $entry "name") }}
{{- $entries = append $entries (dict "where" (printf "extraEnv %s" $name) "name" $name "value" (toString (get $entry "value")) "literal" (hasKey $entry "value")) }}
{{- end }}
{{- end }}
{{- end }}
{{- range $e := $entries }}
{{- if regexMatch $denied (upper (regexReplaceAll "[^A-Za-z0-9]" $e.name "_")) }}
{{- fail (printf "%s %s" $e.where $deniedMsg) }}
{{- end }}
{{- $normalized := regexReplaceAll "[^A-Z0-9]" (upper $e.name) "" }}
{{- if hasPrefix "SPRINGPROFILES" $normalized }}
{{- fail (printf "%s must not be set: %s" $e.where $profileMsg) }}
{{- end }}
{{- if and (regexMatch "^SPRING(DATASOURCE|FLYWAY|LIQUIBASE|R2DBC)" $normalized) (ne $normalized "SPRINGDATASOURCEUSERNAME") }}
{{- fail (printf "%s is not allowed: a spring.datasource.*, spring.flyway.*, spring.liquibase.* or spring.r2dbc.* setting %s" $e.where $datasourceMsg) }}
{{- end }}
{{- if regexMatch "JDBCURL|SSLFACTORY|SSLHOSTNAMEVERIFIER" $normalized }}
{{- fail (printf "%s is not allowed: a setting naming a JDBC URL, an SSL factory or a host name verifier %s" $e.where $datasourceMsg) }}
{{- end }}
{{- if and (ne $e.where "config.DB_URL") (regexMatch "(?i)jdbc:" $e.value) }}
{{- fail (printf "%s is not allowed: a jdbc: value %s" $e.where $datasourceMsg) }}
{{- end }}
{{- if has $normalized $jvmOptions }}
{{- if not $e.literal }}
{{- fail (printf "%s must be a literal value (valueFrom cannot be checked for spring.profiles): %s" $e.where $profileMsg) }}
{{- end }}
{{- if regexMatch "(?i)spring[^a-z0-9]?profiles" $e.value }}
{{- fail (printf "%s must not set spring.profiles: %s" $e.where $profileMsg) }}
{{- end }}
{{- if regexMatch "(?i)jdbc|ssl|spring|flyway|liquibase|datasource|r2dbc|application[._-]?json" $e.value }}
{{- fail (printf "%s must not mention jdbc, ssl, spring, flyway, liquibase, datasource, r2dbc or application.json: JVM system properties %s" $e.where $datasourceMsg) }}
{{- end }}
{{- end }}
{{- end }}
{{- if $extraEnv }}
{{- fail "extraEnv is not supported by this chart: put non-secret settings under config (rendered into the ConfigMap and checked)" }}
{{- end }}
{{- $_ := required "config.DB_URL is required (deploy/terraform output jdbc_url)" .Values.config.DB_URL }}
{{- /* Parsed the way PgJDBC reads it (round 7, as in the consent, payee and atm charts): the URL is
       jdbc:postgresql:// with nothing before it (DatabaseTlsEnvironmentPostProcessor accepts nothing
       else), exactly one '?', nothing that looks like a parameter before it, and no percent-encoded
       '=' or '&' in the query, allow-listed values included. */}}
{{- $url := toString .Values.config.DB_URL }}
{{- if not (hasPrefix "jdbc:postgresql://" $url) }}
{{- fail "config.DB_URL must start with jdbc:postgresql:// (no leading space, no other driver or wrapper; deploy/terraform output jdbc_url)" }}
{{- end }}
{{- if ne 2 (len (splitList "?" $url)) }}
{{- fail "config.DB_URL needs exactly one '?' (deploy/terraform output jdbc_url)" }}
{{- end }}
{{- if regexMatch "[=&;%]" (index (splitList "?" $url) 0) }}
{{- fail "config.DB_URL: nothing that looks like a parameter ('=', '&', ';' or '%') may come before the '?'" }}
{{- end }}
{{- if regexMatch "(?i)%(3d|26)" (index (splitList "?" $url) 1) }}
{{- fail "config.DB_URL must not percent-encode '=' or '&' (%3D, %26) in the query, allow-listed values included" }}
{{- end }}
{{- /* Aurora's certificate is verified against the platform RDS CA bundle (platform contract, Database CA bundle). */}}
{{- $ca := printf "sslrootcert=%s/%s" .Values.databaseCaBundle.mountPath .Values.databaseCaBundle.key }}
{{- /* Each parameter exactly once (any case): the driver must read the value checked here. */}}
{{- range $param := list "sslmode" "sslrootcert" }}
{{- if ne 1 (len (regexFindAll (printf "(?i)[?&]%s=" $param) $.Values.config.DB_URL -1)) }}
{{- fail (printf "config.DB_URL must set %s exactly once, as sslmode=verify-full&%s (deploy/terraform output jdbc_url)" $param $ca) }}
{{- end }}
{{- end }}
{{- if not (and (regexMatch "[?&]sslmode=verify-full(&|$)" .Values.config.DB_URL) (regexMatch (printf "[?&]%s(&|$)" (regexQuoteMeta $ca)) .Values.config.DB_URL)) }}
{{- fail (printf "config.DB_URL must use sslmode=verify-full&%s (deploy/terraform output jdbc_url)" $ca) }}
{{- end }}
{{- /* Nothing else in the query unless allow-listed: sslfactory, sslhostnameverifier,
       service, sslcert, ... can switch verification off or redirect the connection. */}}
{{- $query := index (splitList "?" .Values.config.DB_URL) 1 }}
{{- if or (contains "#" $query) (contains "?" $query) }}
{{- fail "config.DB_URL: a fragment or a second '?' is not allowed" }}
{{- end }}
{{- range $pair := splitList "&" $query }}
{{- $name := lower (first (splitList "=" $pair)) }}
{{- if not (has $name (list "sslmode" "sslrootcert")) }}
{{- if or (hasPrefix "ssl" $name) (eq $name "service") (not (has (first (splitList "=" $pair)) $.Values.databaseUrlAllowedParams)) }}
{{- fail (printf "config.DB_URL parameter %q is not allowed: the query must be sslmode=verify-full&%s plus databaseUrlAllowedParams (never ssl* or service)" $pair $ca) }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "products.name" . }}
  namespace: {{ include "products.namespace" . }}
  labels:
    {{- include "products.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{- /* Empty values are left out so application.yml defaults apply instead of "". */}}
  {{- if $value }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
