{{- if .Values.externalSecret.enabled }}
{{- /* Each container gets only its own credential: the runtime role's
       <env>/<service>/db-app, the migrate init container the schema owner's
       <env>/<service>/db-migration. The import credential (db-import) is for
       operators only and never reaches the cluster. */}}
{{- $app := required "externalSecret.remoteSecretName is required" .Values.externalSecret.remoteSecretName }}
{{- $migration := required "externalSecret.migrationRemoteSecretName is required" .Values.externalSecret.migrationRemoteSecretName }}
{{- range $name, $value := dict "remoteSecretName" $app "migrationRemoteSecretName" $migration }}
{{- if contains "db-import" $value }}
{{- fail (printf "externalSecret.%s must not name the import credential (db-import): %s" $name $value) }}
{{- end }}
{{- end }}
{{- if not (hasSuffix "/db-app" $app) }}
{{- fail (printf "externalSecret.remoteSecretName must end with /db-app (runtime role): %s" $app) }}
{{- end }}
{{- if not (hasSuffix "/db-migration" $migration) }}
{{- fail (printf "externalSecret.migrationRemoteSecretName must end with /db-migration (schema owner): %s" $migration) }}
{{- end }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "products.dbSecretName" . }}
  namespace: {{ include "products.namespace" . }}
  labels:
    {{- include "products.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
    name: {{ .Values.externalSecret.secretStoreRef.name }}
  target:
    name: {{ include "products.dbSecretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: {{ $app }}
        property: password
---
# Schema owner credential (open_products_catalog_owner), used only by the
# migrate init container; the serving container never receives it.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "products.migrationSecretName" . }}
  namespace: {{ include "products.namespace" . }}
  labels:
    {{- include "products.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
    name: {{ .Values.externalSecret.secretStoreRef.name }}
  target:
    name: {{ include "products.migrationSecretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: FLYWAY_USER
      remoteRef:
        key: {{ $migration }}
        property: username
    - secretKey: FLYWAY_PASSWORD
      remoteRef:
        key: {{ $migration }}
        property: password
{{- end }}
