{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "products.dbSecretName" . }}
  namespace: {{ include "products.namespace" . }}
  labels:
    {{- include "products.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
    name: {{ .Values.externalSecret.secretStoreRef.name }}
  target:
    name: {{ include "products.dbSecretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: {{ required "externalSecret.remoteSecretName is required" .Values.externalSecret.remoteSecretName }}
        property: password
---
# Schema owner credential (open_products_catalog_owner), used only by the
# migrate init container; the serving container never receives it.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "products.migrationSecretName" . }}
  namespace: {{ include "products.namespace" . }}
  labels:
    {{- include "products.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
    name: {{ .Values.externalSecret.secretStoreRef.name }}
  target:
    name: {{ include "products.migrationSecretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: FLYWAY_USER
      remoteRef:
        key: {{ required "externalSecret.migrationRemoteSecretName is required" .Values.externalSecret.migrationRemoteSecretName }}
        property: username
    - secretKey: FLYWAY_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecret.migrationRemoteSecretName }}
        property: password
{{- end }}
