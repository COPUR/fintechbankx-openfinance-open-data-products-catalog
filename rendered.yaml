# Source: open-products-catalog-service/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: open-products-catalog-service
  namespace: "open-finance"
  labels:
    app.kubernetes.io/name: open-products-catalog-service
    app.kubernetes.io/instance: ci
    app.kubernetes.io/component: service
    app.kubernetes.io/version: "ci"
    app.kubernetes.io/part-of: fintechbankx-open-finance
    app.kubernetes.io/managed-by: Helm
    fintechbankx.io/service-id: "svc-of-open-products-catalog"
    helm.sh/chart: open-products-catalog-service-0.1.0
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: open-products-catalog-service
      app.kubernetes.io/instance: ci
      app.kubernetes.io/component: service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # API traffic only through the gateway.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "istio-ingress"
      ports:
        - protocol: TCP
          port: 8080
    # Prometheus scrapes the management port.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "observability"
      ports:
        - protocol: TCP
          port: 8081
    # Istio sidecar: kubelet probes are rewritten to the agent on 15020 and
    # sidecar readiness is on 15021. Probes come from the node, which no
    # namespace selector matches, so these ports are open to the cluster.
    - ports:
        - protocol: TCP
          port: 15020
        - protocol: TCP
          port: 15021
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Aurora PostgreSQL, only to the cluster's subnets
    - ports:
        - protocol: TCP
          port: 5432
      to:
        - ipBlock:
            cidr: "10.0.32.0/20"
    # OTLP traces to the platform collector
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "observability"
      ports:
        - protocol: TCP
          port: 4318
    # Istio sidecar control plane (xDS, certificates)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - protocol: TCP
          port: 15012
