apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-products-catalog-service
  namespace: "open-finance"
  labels:
    app.kubernetes.io/name: open-products-catalog-service
    app.kubernetes.io/instance: ci
    app.kubernetes.io/component: service
    app.kubernetes.io/version: "ci"
    app.kubernetes.io/part-of: fintechbankx-open-finance
    app.kubernetes.io/managed-by: Helm
    fintechbankx.io/service-id: "svc-of-open-products-catalog"
    helm.sh/chart: open-products-catalog-service-0.1.0
spec:
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: open-products-catalog-service
      app.kubernetes.io/instance: ci
      app.kubernetes.io/component: service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-products-catalog-service
        app.kubernetes.io/instance: ci
        app.kubernetes.io/component: service
        app: open-products-catalog-service
        app.kubernetes.io/part-of: fintechbankx-open-finance
        fintechbankx.io/service-id: svc-of-open-products-catalog
        version: "ci"
        sidecar.istio.io/inject: "true"
      annotations:
        checksum/config: 4ebe5151c7c234adaeee3a53f4d3784d819e0f58841a30c6cb5c6825c6fe9d4f
        # Restarts pods when the secret mapping changes, and on the next
        # upgrade after a credential rotation (lookup reads the synced Secrets'
        # data; it is empty under helm template/lint).
        checksum/secret: 0efba3d2a1e0f3589d91779c74102e24843aa981ea411fc4dc07f11c1743a9e4
        # Aurora is outside the mesh (PostgreSQL TLS end to end); without this the
        # migrate init container, which runs before the sidecar, cannot connect.
        traffic.sidecar.istio.io/excludeOutboundPorts: "5432"
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: /actuator/prometheus
    spec:
      serviceAccountName: "open-products-catalog-service"
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: open-products-catalog-service
              app.kubernetes.io/instance: ci
              app.kubernetes.io/component: service
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: open-products-catalog-service
              app.kubernetes.io/instance: ci
              app.kubernetes.io/component: service
      initContainers:
        # Flyway as the schema owner, then exit (OPEN_PRODUCTS_MIGRATE_ONLY).
        # Replicas starting together are serialised by Flyway's lock.
        - name: migrate
          image: "ci/open-products-catalog-service:ci"
          imagePullPolicy: "IfNotPresent"
          envFrom:
            - configMapRef:
                name: open-products-catalog-service
            - secretRef:
                name: open-products-catalog-service-db-migration
          env:
            # Startup refuses a database URL without verified TLS (DatabaseTlsEnvironmentPostProcessor).
            - name: SPRING_PROFILES_ACTIVE
              value: aws
            - name: OPEN_PRODUCTS_MIGRATE_ONLY
              value: "true"
            - name: SPRING_MAIN_WEB_APPLICATION_TYPE
              value: none
            # Hibernate validates the migrated schema with the same owner login.
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: open-products-catalog-service-db-migration
                  key: FLYWAY_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: open-products-catalog-service-db-migration
                  key: FLYWAY_PASSWORD
          resources:
            limits:
              memory: 768Mi
            requests:
              cpu: 250m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: rds-ca-bundle
              mountPath: "/etc/fintechbankx/rds-ca"
              readOnly: true
      containers:
        - name: open-products-catalog-service
          image: "ci/open-products-catalog-service:ci"
          imagePullPolicy: "IfNotPresent"
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: open-products-catalog-service
            - secretRef:
                name: open-products-catalog-service-db
          env:
            # Startup refuses a database URL without verified TLS (DatabaseTlsEnvironmentPostProcessor).
            - name: SPRING_PROFILES_ACTIVE
              value: aws
            # The schema was migrated by the init container; the runtime role
            # (SELECT on product only) could not run Flyway anyway.
            - name: SPRING_FLYWAY_ENABLED
              value: "false"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          resources:
            limits:
              memory: 768Mi
            requests:
              cpu: 250m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: rds-ca-bundle
              mountPath: "/etc/fintechbankx/rds-ca"
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        # Platform trust-manager bundle; JDBC verifies Aurora's certificate with it.
        - name: rds-ca-bundle
          configMap:
            name: "rds-ca-bundle"
            items:
              - key: "global-bundle.pem"
                path: "global-bundle.pem"
