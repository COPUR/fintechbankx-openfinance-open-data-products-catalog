# svc-of-open-products-catalog runtime configuration.
# Every environment-specific value comes from the environment (Helm values,
# Kubernetes Secret synced from AWS Secrets Manager); nothing secret is here.
spring:
  application:
    name: open-products-catalog-service
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 25s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/db_of_open_products_catalog_local}
    username: ${DB_USERNAME:open_products_catalog_app}
    # The credential is bound from SPRING_DATASOURCE_PASSWORD (Kubernetes Secret
    # synced from AWS Secrets Manager); it is never written in this file.
    hikari:
      schema: sc_of_open_products_catalog
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 3000
      max-lifetime: 1200000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: sc_of_open_products_catalog
        jdbc:
          time_zone: UTC
  flyway:
    schemas: sc_of_open_products_catalog
    default-schema: sc_of_open_products_catalog
    create-schemas: true
    locations: classpath:db/migration
    # Flyway runs as the schema owner (secret <env>/open-products-catalog-service/db-migrate),
    # never as the runtime role; locally and in CI it falls back to the datasource login.
    user: ${FLYWAY_USER:${spring.datasource.username}}
    password: ${FLYWAY_PASSWORD:${spring.datasource.password:}}

openproducts:
  # true: migrate the schema and exit (Helm init container); see MigrateOnlyConfiguration.
  migrate-only: ${OPEN_PRODUCTS_MIGRATE_ONLY:false}
  catalog:
    # postgres (default) is the only runtime store; tests may switch to in-memory.
    store: postgres
    # The offerable catalogue is held in memory and reloaded at most once per
    # interval, so request rate and filters do not drive database load. 0s disables it.
    snapshot-refresh: ${OPEN_PRODUCTS_SNAPSHOT_REFRESH:10s}
    # Sample rows from classpath:db/seed; true only in dev and CI.
    seed-enabled: ${OPEN_PRODUCTS_SEED_ENABLED:false}

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  metrics:
    tags:
      service: svc-of-open-products-catalog
    distribution:
      percentiles-histogram:
        http.server.requests: true
  observations:
    key-values:
      service: svc-of-open-products-catalog
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      # Boot 3.3 exports OTLP over HTTP; the platform collector listens on 4318.
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"
