# Test resources: the tests boot the service in memory (profile in-memory) or against a
# plain local PostgreSQL (TEST_DB_URL), so the startup TLS check
# (fintechbankx.tls.enforce, true in application.yml) is switched off here only.
# .properties beside the main application.yml: both load, and this one wins.
fintechbankx.tls.enforce=false
