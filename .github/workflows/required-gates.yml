name: Required Gates

on:
  pull_request:
    branches: [main, dev, staging]
  push:
    branches: [main, dev, staging]

permissions:
  contents: read

jobs:
  build:
    name: ci/build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build
        shell: bash
        run: |
          if [ -f build.gradle ] || [ -f settings.gradle ] || [ -f gradlew ]; then
            GRADLE=gradle
            if [ -x ./gradlew ]; then GRADLE=./gradlew; fi
            if ! $GRADLE --no-daemon clean assemble -x test; then
              if [ -f .ci/allow-gradle-fail ]; then
                echo "Gradle build failed but .ci/allow-gradle-fail is present; continuing."
              else
                exit 1
              fi
            fi
          else
            echo "No Gradle root build in this repository; skipping Gradle build."
          fi
          if [ -f package.json ]; then
            npm ci
            npm run build --if-present
          else
            echo "No package.json build in this repository; skipping Node build."
          fi

  test:
    name: ci/test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: db_of_open_products_catalog_test
          POSTGRES_USER: open_products_test
          # A throwaway CI database that trusts its clients for this job only, so no credential is written here.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U open_products_test -d db_of_open_products_catalog_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # OpenProductsPostgresIT runs Flyway, the dev seed and the full service against this database.
      TEST_DB_URL: jdbc:postgresql://localhost:5432/db_of_open_products_catalog_test
      TEST_DB_USERNAME: open_products_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run tests
        shell: bash
        run: |
          if [ -f build.gradle ] || [ -f settings.gradle ] || [ -f gradlew ]; then
            GRADLE=gradle
            if [ -x ./gradlew ]; then GRADLE=./gradlew; fi
            # check = tests + the jacoco LINE >= 0.85 gate.
            if ! $GRADLE --no-daemon check; then
              if [ -f .ci/allow-gradle-fail ]; then
                echo "Gradle test failed but .ci/allow-gradle-fail is present; continuing."
              else
                exit 1
              fi
            fi
          else
            echo "No Gradle root test task in this repository; skipping Gradle test."
          fi
          if [ -f package.json ]; then
            npm ci
            npm test --if-present
          else
            echo "No package.json test in this repository; skipping Node test."
          fi

      - name: TDD guard (ADR-029) - production changes need test changes
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
          NO_BEHAVIOUR_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'no-behaviour-change') }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          main_changes="$(printf '%s\n' "$changed" | grep -E '(^|/)src/main/' || true)"
          test_changes="$(printf '%s\n' "$changed" | grep -E '(^|/)src/test/' || true)"
          if [ -n "$main_changes" ] && [ -z "$test_changes" ]; then
            if [ "$NO_BEHAVIOUR_CHANGE" = "true" ]; then
              echo "src/main changed without src/test changes; allowed by label no-behaviour-change."
            else
              echo "This PR changes src/main but no file under src/test (ADR-029):"
              printf '%s\n' "$main_changes"
              echo "Add or update tests, or label the PR no-behaviour-change if it truly changes no behaviour."
              exit 1
            fi
          fi
          echo "TDD guard passed."

      - name: OpenAPI contract lint
        if: ${{ hashFiles('openapi/*.yaml') != '' || hashFiles('api/openapi/*.yaml') != '' || hashFiles('src/main/resources/openapi/*.yaml') != '' }}
        env:
          NPM_CONFIG_CACHE: /tmp/.npm
        shell: bash
        run: |
          if ls openapi/*.yaml >/dev/null 2>&1; then
            npx -y @redocly/cli@1.27.1 lint openapi/*.yaml
          elif ls api/openapi/*.yaml >/dev/null 2>&1; then
            npx -y @redocly/cli@1.27.1 lint api/openapi/*.yaml
          elif ls src/main/resources/openapi/*.yaml >/dev/null 2>&1; then
            npx -y @redocly/cli@1.27.1 lint src/main/resources/openapi/*.yaml
          fi

      - name: Install oasdiff
        if: ${{ hashFiles('openapi/*.yaml') != '' || hashFiles('api/openapi/*.yaml') != '' || hashFiles('src/main/resources/openapi/*.yaml') != '' }}
        shell: bash
        run: |
          tmpdir="$(mktemp -d)"
          # Asset picked by runner architecture and checked against the release sha256 (governance ci-runner snippet).
          case "$(uname -m)" in
            x86_64) oasdiff_arch=amd64; oasdiff_sha=85514a6044d9cce53816b3558b17be4f784e481e43bf345b1029a6ccc5c0e439 ;;
            aarch64|arm64) oasdiff_arch=arm64; oasdiff_sha=eff7c6d6d361fc29085925f6871d8b41406baadede6b87a4a055a2b640ac8a05 ;;
            *) echo "unsupported runner architecture $(uname -m)"; exit 1 ;;
          esac
          curl -sSfL -o "$tmpdir/oasdiff.tar.gz" "https://github.com/oasdiff/oasdiff/releases/download/v1.12.1/oasdiff_1.12.1_linux_${oasdiff_arch}.tar.gz"
          echo "${oasdiff_sha}  $tmpdir/oasdiff.tar.gz" | sha256sum -c -
          tar -xz -C "$tmpdir" -f "$tmpdir/oasdiff.tar.gz"
          sudo install "$tmpdir/oasdiff" /usr/local/bin/oasdiff
          rm -rf "$tmpdir"

      - name: OpenAPI breaking-change guard
        if: ${{ hashFiles('openapi/*.yaml') != '' || hashFiles('api/openapi/*.yaml') != '' || hashFiles('src/main/resources/openapi/*.yaml') != '' }}
        run: ./scripts/ci/oasdiff-breaking.sh

      - name: FAPI/DPoP contract guard
        if: ${{ hashFiles('openapi/*.yaml') != '' || hashFiles('api/openapi/*.yaml') != '' || hashFiles('src/main/resources/openapi/*.yaml') != '' }}
        run: ./scripts/ci/fapi-dpop-guard.sh

      - name: Guardrail - disallow generic map request payloads
        shell: bash
        run: |
          if [ -d src/main/java ]; then
            if grep -R -nE "Map<\s*String\s*,\s*Object\s*>" src/main/java --include="*Controller.java"; then
              echo "Generic Map<String,Object> payloads are disallowed in controllers."
              exit 1
            fi
          else
            echo "No Java controller sources in this repository; guardrail check skipped."
          fi

  security:
    name: ci/security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gitleaks
        shell: bash
        run: |
          tmpdir="$(mktemp -d)"
          # Asset picked by runner architecture and checked against the release sha256 (governance ci-runner snippet).
          case "$(uname -m)" in
            x86_64) gitleaks_arch=x64; gitleaks_sha=9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c ;;
            aarch64|arm64) gitleaks_arch=arm64; gitleaks_sha=5f2edbe1f49f7b920f9e06e90759947d3c5dfc16f752fb93aaafc17e9d14cf07 ;;
            *) echo "unsupported runner architecture $(uname -m)"; exit 1 ;;
          esac
          curl -sSfL -o "$tmpdir/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_${gitleaks_arch}.tar.gz"
          echo "${gitleaks_sha}  $tmpdir/gitleaks.tar.gz" | sha256sum -c -
          tar -xz -C "$tmpdir" -f "$tmpdir/gitleaks.tar.gz"
          sudo install "$tmpdir/gitleaks" /usr/local/bin/gitleaks
          rm -rf "$tmpdir"

      - name: Run gitleaks (workspace scan)
        shell: bash
        run: |
          gitleaks detect --source . --no-banner --redact --no-git --config .gitleaks.toml \
            --report-format json --report-path gitleaks-report.json || {
              cat gitleaks-report.json
              exit 1
            }
