name: Deployability

# Proves every change still produces a runnable image and valid deployment
# manifests, and rehearses the catalogue's data path. Nothing is pushed or
# applied from here.

on:
  pull_request:
    branches: [main, dev, staging]
  push:
    branches: [main, dev, staging]

permissions:
  contents: read

jobs:
  container:
    name: deploy/container-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag open-products-catalog-service:${{ github.sha }} .
      - name: Image runs as non-root
        run: |
          user="$(docker image inspect --format '{{.Config.User}}' open-products-catalog-service:${{ github.sha }})"
          echo "image user: $user"
          test "$user" = "10001:10001"

  helm:
    name: deploy/helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Lint and render chart
        run: |
          chart=deploy/helm/open-products-catalog-service
          args="--set image.repository=ci/open-products-catalog-service --set image.tag=${{ github.sha }} --set externalSecret.remoteSecretName=ci/open-products-catalog-service/db-app --set externalSecret.migrationRemoteSecretName=ci/open-products-catalog-service/db-migration --set config.DB_URL=jdbc:postgresql://ci-writer.example.internal:5432/db_of_open_products_catalog_ci --set networkPolicy.enabled=true --set networkPolicy.databaseCidrs={10.0.32.0/20}"
          helm template ci "$chart" ${args%% --set networkPolicy.enabled=*} > /dev/null
          helm lint "$chart" $args
          helm template ci "$chart" $args > rendered.yaml
          helm template ci "$chart" -f "$chart/values-dev.yaml" $args > /dev/null
      - name: Rendering fails without database CIDRs
        run: |
          chart=deploy/helm/open-products-catalog-service
          if helm template ci "$chart" --set image.repository=ci/x --set image.tag=1 \
               --set externalSecret.remoteSecretName=ci/x/db-app --set externalSecret.migrationRemoteSecretName=ci/x/db-migration \
               --set config.DB_URL=jdbc:postgresql://ci/x --set networkPolicy.enabled=true > /dev/null 2> cidr.err; then
            echo "chart rendered with an empty networkPolicy.databaseCidrs"
            exit 1
          fi
          grep -q "databaseCidrs is required" cidr.err
      - name: Rendered ConfigMap has no empty or identity-provider keys
        run: |
          if grep -nE '^  OIDC_|: ""$' rendered.yaml; then
            echo "ConfigMap renders OIDC_* or empty values"
            exit 1
          fi

  terraform:
    name: deploy/terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  data-migration:
    name: deploy/data-migration-rehearsal
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rehearsal
          POSTGRES_PASSWORD: rehearsal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rehearsal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: rehearsal
      PGPASSWORD: rehearsal
    steps:
      - uses: actions/checkout@v4
      - name: Rehearse schema migration, dev seed and idempotent catalogue import
        run: scripts/migration/verify-migration.sh
