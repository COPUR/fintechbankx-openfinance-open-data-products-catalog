          fi
      - name: Rendering fails for a Spring profile set through values (startup TLS assertion)
        run: |
          chart=deploy/helm/open-products-catalog-service
          common="--set image.repository=ci/x --set image.tag=1 --set externalSecret.remoteSecretName=ci/x/db-app --set externalSecret.migrationRemoteSecretName=ci/x/db-migration"
          url='jdbc:postgresql://ci/x?sslmode=verify-full&sslrootcert=/etc/fintechbankx/rds-ca/global-bundle.pem'
          # Round 6 (as in retail and corporate): DatabaseTlsEnvironmentPostProcessor runs under the aws
          # profile the chart renders on every container. Nothing in values may change the profiles:
          # SPRING_PROFILES_* in config or extraEnv in any spelling Spring's relaxed binding reads
          # (case, ".", "_" and "-" ignored), SPRING_APPLICATION_JSON, and JVM option variables that
          # set spring.profiles.* (for example a local profile). There is no enforce flag.
          work="$(mktemp -d)"
          values() { f="$(mktemp -p "$work")"; printf '%s\n' 'config:' "  DB_URL: \"$url\"" "$@" > "$f"; echo "$f"; }
          must_refuse() {
            desc="$1"; expected="$2"; shift 2
            if out="$(helm template ci "$chart" $common "$@" 2>&1)"; then echo "$desc must be refused"; exit 1; fi
            echo "$out" | grep -qE "$expected" || { echo "$desc failed for another reason: $out"; exit 1; }
          }
          for name in SPRING_PROFILES_ACTIVE spring.profiles.active Spring-Profiles-Include SPRING_PROFILES_DEFAULT \
                      spring_profiles_group_aws SPRING_PROFILESACTIVE; do
            must_refuse "config.$name" 'startup TLS assertion|is not allowed: a profile' -f "$(values "  $name: local")"
            must_refuse "extraEnv $name" 'startup TLS assertion|must not set .*: a profile' -f "$(values 'extraEnv:' "  - name: $name" '    value: local')"
          done
          must_refuse "extraEnv map SPRING_PROFILES_ACTIVE" 'startup TLS assertion|must not set SPRING_PROFILES_ACTIVE .*: a profile' -f "$(values 'extraEnv:' '  SPRING_PROFILES_ACTIVE: local')"
          for name in SPRING_APPLICATION_JSON spring.application.json; do
            must_refuse "config.$name" 'SPRING_APPLICATION_JSON|config.spring.application.json is not allowed' -f "$(values "  $name: '{\"spring\":{\"profiles\":{\"active\":\"local\"}}}'")"
          done
          for name in JAVA_TOOL_OPTIONS JDK_JAVA_OPTIONS JAVA_OPTS java.tool.options; do
            must_refuse "config.$name with spring.profiles" 'startup TLS assertion|must not mention .*spring.profiles' -f "$(values "  $name: -Dspring.profiles.active=local")"
            must_refuse "config.$name with SPRING_PROFILES" 'startup TLS assertion|must not mention .*spring.profiles' -f "$(values "  $name: -DSPRING_PROFILES_INCLUDE=local")"
            must_refuse "extraEnv $name with spring.profiles" 'startup TLS assertion|must not mention .*spring.profiles' -f "$(values 'extraEnv:' "  - name: $name" '    value: -Dspring-profiles-active=local')"
          done
          # JVM options that do not touch profiles still render.
          helm template ci "$chart" $common -f "$(values '  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70')" > /dev/null
          rm -rf "$work"
          # The only profile setting in the rendered manifests is the chart's own SPRING_PROFILES_ACTIVE=aws.
          got="$(grep -iE -A1 'SPRING[._-]?PROFILES' rendered.yaml | grep -v '^--$' || true)"
          names="$(echo "$got" | grep -ciE 'SPRING[._-]?PROFILES' || true)"
          wanted="$(echo "$got" | grep -cE '^[[:space:]]*- name: SPRING_PROFILES_ACTIVE$' || true)"
          aws="$(echo "$got" | grep -cE '^[[:space:]]*value: "?aws"?$' || true)"
          if [ "$names" -eq 0 ] || [ "$names" -ne "$wanted" ] || [ "$names" -ne "$aws" ]; then
            echo "rendered profile settings must be the chart's own SPRING_PROFILES_ACTIVE=aws: $got"; exit 1
          fi
      - name: Vendored guard refuses on every adapter route, and interpolated keys and values stay in place
        run: |
          # README "Vendoring the guard" steps 2-4 (cicd-templates a4f0072): the adapter in
          # deployment.yaml maps config, extraEnv (list or map form), envFrom, extraEnvFrom,
          # databaseCa, kafka.runtime and the rendered ExternalSecrets (no env value of the templates is
          # interpolated from values: all literals or secretKeyRefs); each
          # case keeps the guard's message so it cannot pass because the render failed for another reason.
          chart=deploy/helm/open-products-catalog-service
          good='jdbc:postgresql://ci/x?sslmode=verify-full&sslrootcert=/etc/fintechbankx/rds-ca/global-bundle.pem'
          base="--set image.repository=ci/x --set image.tag=x --set externalSecret.remoteSecretName=ci/x/db-app --set externalSecret.migrationRemoteSecretName=ci/x/db-migration --set config.DB_URL=$good"
          failed=0
          must_fail() {  # <expected text in the error> <helm args...>
            local expect="$1"; shift
            if helm template ci "$chart" $base "$@" > /dev/null 2> guard.err; then
              echo "chart rendered with: $*"; failed=1
            elif ! grep -q -- "$expect" guard.err; then
              echo "render failed for another reason than '$expect' with: $*"; cat guard.err; failed=1
            fi
          }
          work="$(mktemp -d)"
          # Template interpolation: a key with a newline would open further keys the checks never see.
          printf 'config:\n  "X\\nSPRING_CONFIG_IMPORT": "optional:file:/tmp/x.yml"\n' > "$work/config-key-newline.yaml"
          must_fail 'is not a ConfigMap key' -f "$work/config-key-newline.yaml"
          printf 'config:\n  "X: y\\n  SPRING_DATASOURCE_URL": "x"\n' > "$work/config-key-colon.yaml"
          must_fail 'is not a ConfigMap key' -f "$work/config-key-colon.yaml"
          # The ExternalSecret remote keys come from values (--set-file outranks --set).
          printf 'ci/x\n  property: x/db-app' > "$work/remote-key"
          must_fail 'must not contain a control character' --set-file "externalSecret.remoteSecretName=$work/remote-key"
          printf 'ci/x\n  property: x/db-migration' > "$work/remote-key"
          must_fail 'must not contain a control character' --set-file "externalSecret.migrationRemoteSecretName=$work/remote-key"
          # '$(' reaches no env value of the templates here; it is refused in DB_URL and extraEnv.
          must_fail "config.DB_URL must not contain" --set-string "config.DB_URL=$good&ApplicationName=\$(X)" --set 'databaseUrlAllowedParams={ApplicationName}'
          # Routes the chart does not render are refused rather than ignored.
          must_fail 'envFrom is not supported' --set 'envFrom[0].configMapRef.name=x'
          must_fail 'extraEnvFrom is not supported' --set 'extraEnvFrom[0].secretRef.name=x'
          must_fail 'externalSecret.dataFrom is not supported' --set 'externalSecret.dataFrom[0].extract.key=x'
          must_fail 'javaToolOptions is not supported' --set-string 'javaToolOptions=-XX:MaxRAMPercentage=70'
          must_fail 'externalSecret.data is not supported' --set 'externalSecret.data[0].secretKey=X'
          must_fail 'externalSecret.extraData is not supported' --set 'externalSecret.extraData[0].secretKey=X'
          # No Kafka client (kafka.runtime ""): a Kafka protocol key in config fails the render.
          must_fail 'config.KAFKA_SECURITY_PROTOCOL is set but kafka.runtime is empty' --set config.KAFKA_SECURITY_PROTOCOL=SSL
          must_fail 'config.X_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM must be https' --set-string config.X_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM=
          # Must pass: quoted values with a newline stay one value; no key or container field is added.
          helm template ci "$chart" $base > "$work/baseline.yaml"
          cat > "$work/hostile.yaml" <<'VALUES'
          image:
            tag: "x\"\n          args: [\"--spring.config.import=file:/tmp/x.yml\"]"
          config:
            OPEN_PRODUCTS_SEED_ENABLED: "aud\nSPRING_CONFIG_IMPORT: file:/tmp/x.yml"
          databaseCaBundle:
            configMapName: "rds-ca-bundle\n  optional: true"
          VALUES
          # --set outranks -f, so the hostile render takes image.tag from the file only.
          helm template ci "$chart" ${base/--set image.tag=x/} -f "$work/hostile.yaml" > "$work/hostile-out.yaml"
          python3 - "$work/baseline.yaml" "$work/hostile-out.yaml" <<'PY'
          import sys, yaml
          def load(p):
              return {(d["kind"], d["metadata"]["name"]): d for d in yaml.safe_load_all(open(p)) if d}
          base, bad = load(sys.argv[1]), load(sys.argv[2])
          assert base.keys() == bad.keys(), "a hostile value added or removed a document"
          for key, d in base.items():
              if key[0] not in ("Deployment", "Job", "CronJob"):
                  continue
              pod = (lambda x: x["spec"]["jobTemplate"]["spec"]["template"]["spec"] if key[0] == "CronJob" else x["spec"]["template"]["spec"])
              spec, other = pod(d), pod(bad[key])
              assert spec.keys() == other.keys(), f"{key}: pod spec fields changed"
              for c, o in zip(spec.get("initContainers", []) + spec["containers"], other.get("initContainers", []) + other["containers"]):
                  assert c.keys() == o.keys(), f"{key}: container fields changed: {sorted(set(o) ^ set(c))}"
                  assert [e["name"] for e in c.get("env", [])] == [e["name"] for e in o.get("env", [])], f"{key}: env names changed"
                  assert o["image"].startswith("ci/x:x\"\n"), f"{key}: image tag not kept as one value"
              vols = {v["name"]: v for v in other["volumes"]}
              assert vols["rds-ca-bundle"]["configMap"].keys() == {"name", "items"}, f"{key}: configMap volume fields changed"
          cm = next(d for (k, _), d in bad.items() if k == "ConfigMap")
          cm0 = next(d for (k, _), d in base.items() if k == "ConfigMap")
          assert cm["data"].keys() == cm0["data"].keys(), "ConfigMap keys changed"
          assert cm["data"]["OPEN_PRODUCTS_SEED_ENABLED"] == "aud\nSPRING_CONFIG_IMPORT: file:/tmp/x.yml", "config value not kept as one value"
          print("hostile values stay single quoted values: no added keys, env entries or container fields")
          PY
          rm -rf "$work" guard.err
          exit $failed
      - name: The chart renders the deployment marker FBX_DEPLOYED=true on every container that runs the TLS check
        run: |
          # DatabaseTlsEnvironmentPostProcessor enforces with FBX_DEPLOYED whatever the profiles (aws
          # required, no local, test or in-memory profile): migrate, the service, the history guard
          # CronJob and the release gate Job. Rendered directly, never from values.
          chart=deploy/helm/open-products-catalog-service
          for np in false true; do
            helm template ci "$chart" --set image.repository=ci/x --set image.tag=1 \
              --set externalSecret.remoteSecretName=ci/x/db-app --set externalSecret.migrationRemoteSecretName=ci/x/db-migration \
              --set 'config.DB_URL=jdbc:postgresql://ci/x?sslmode=verify-full&sslrootcert=/etc/fintechbankx/rds-ca/global-bundle.pem' \
              --set networkPolicy.enabled=$np --set "networkPolicy.databaseCidrs={10.0.32.0/20}" > marker.yaml
            python3 - marker.yaml "CronJob/history-guard-check,Deployment/migrate,Deployment/open-products-catalog-service,Job/history-guard-check" <<'PY'
          import sys, yaml
          docs = [d for d in yaml.safe_load_all(open(sys.argv[1])) if d]
          want = set(sys.argv[2].split(","))
          containers = []
          for d in docs:
              spec = None
              if d["kind"] in ("Deployment", "Job"):
                  spec = d["spec"]["template"]["spec"]
              elif d["kind"] == "CronJob":
                  spec = d["spec"]["jobTemplate"]["spec"]["template"]["spec"]
              if spec:
                  containers += [(f"{d['kind']}/{c['name']}", c) for c in spec.get("initContainers", []) + spec["containers"]]
          assert {w for w, _ in containers} == want, f"expected containers {sorted(want)}, got {sorted(w for w, _ in containers)}"
          for where, c in containers:
              env = [e for e in c.get("env", []) if e["name"] == "FBX_DEPLOYED"]
              assert env == [{"name": "FBX_DEPLOYED", "value": "true"}], f"{where} must set FBX_DEPLOYED=true once, as a literal, got {env}"
          for cm in (d for d in docs if d["kind"] == "ConfigMap"):
              assert not [k for k in (cm.get("data") or {}) if "".join(ch for ch in k.upper() if ch.isalnum()) == "FBXDEPLOYED"], \
                  f"ConfigMap {cm['metadata']['name']} must not carry FBX_DEPLOYED"
          print("FBX_DEPLOYED=true on " + ", ".join(sorted(w for w, _ in containers)))
          PY
          done
          rm -f marker.yaml
      - name: Every database client container trusts the platform RDS CA bundle
        run: |
          # ConfigMap rds-ca-bundle (key global-bundle.pem), published by trust-manager (platform contract).
          # migrate, the service, the history guard CronJob and the release gate Job.
          grep -q "name: rds-ca-bundle$" rendered.yaml
          test "$(grep -c 'mountPath: "/etc/fintechbankx/rds-ca"$' rendered.yaml)" -eq 4
      - name: App pods and every selector carry app.kubernetes.io/component=service
        run: |
          # cicd-templates 335a345: component=service keeps Service, PDB, NetworkPolicy,
          # topology spread and the Deployment selector on the serving pods only.
          python3 - rendered.yaml <<'PY'
          import sys, yaml
          docs = [d for d in yaml.safe_load_all(open(sys.argv[1])) if d]
          def need(labels, where):
              if (labels or {}).get("app.kubernetes.io/component") != "service":
                  sys.exit(f"{where} lacks app.kubernetes.io/component=service: {labels}")
          seen = set()
          for d in docs:
              kind, spec = d["kind"], d.get("spec", {})
              seen.add(kind)
              if kind == "Deployment":
                  need(spec["selector"]["matchLabels"], "Deployment selector")
                  need(spec["template"]["metadata"]["labels"], "app pod labels")
                  for c in spec["template"]["spec"].get("topologySpreadConstraints", []):
                      need(c["labelSelector"]["matchLabels"], "topology spread selector")
              elif kind == "Service":
                  need(spec["selector"], "Service selector")
              elif kind == "PodDisruptionBudget":
                  need(spec["selector"]["matchLabels"], "PodDisruptionBudget selector")
              elif kind == "NetworkPolicy":
                  need(spec["podSelector"]["matchLabels"], "NetworkPolicy podSelector")
          missing = {"Deployment", "Service", "PodDisruptionBudget", "NetworkPolicy"} - seen
          if missing:
              sys.exit(f"rendered.yaml has no {sorted(missing)}")
          print("component=service on the app pods and every selector")
          PY
      - name: Every container runs under the aws profile, and the history guard check is scheduled and gates upgrades
        run: |
          chart=deploy/helm/open-products-catalog-service
          cat > guard-check.py <<'PY'
          import sys, yaml
          docs = [d for d in yaml.safe_load_all(open(sys.argv[1])) if d]
          break_glass = sys.argv[2] if len(sys.argv) > 2 else ""
          def env(c):
              return {e["name"]: e.get("value") for e in c.get("env", [])}
          def fail(msg):
              sys.exit(msg)
          deploy = next(d for d in docs if d["kind"] == "Deployment")
          pod = deploy["spec"]["template"]["spec"]
          for c in pod.get("initContainers", []) + pod["containers"]:
              if env(c).get("SPRING_PROFILES_ACTIVE") != "aws":
                  fail(f"container {c['name']} does not run under SPRING_PROFILES_ACTIVE=aws (startup TLS check)")
          def check_pod(kind, tpl):
              labels = tpl["metadata"]["labels"]
              if labels.get("app.kubernetes.io/component") != "history-guard-check":
                  fail(f"{kind} pods must carry app.kubernetes.io/component=history-guard-check: {labels}")
              if str(labels.get("sidecar.istio.io/inject")) != "false":
                  fail(f"{kind} pods must not get a sidecar (a Job with a sidecar never completes)")
              spec = tpl["spec"]
              if spec.get("restartPolicy") != "Never":
                  fail(f"{kind} pods must not restart: one run, one answer")
              (c,) = spec["containers"]
              e = env(c)
              want = {"OPEN_PRODUCTS_HISTORY_GUARD_CHECK": "true", "SPRING_PROFILES_ACTIVE": "aws",
                      "SPRING_FLYWAY_ENABLED": "false", "SPRING_MAIN_WEB_APPLICATION_TYPE": "none"}
              for k, v in want.items():
                  if e.get(k) != v:
                      fail(f"{kind} container env {k} must be {v}, got {e.get(k)}")
              secrets = [s["secretRef"]["name"] for s in c.get("envFrom", []) if "secretRef" in s]
              if secrets != ["open-products-catalog-service-db"]:
                  fail(f"{kind} must use the runtime credential only (db-app), got {secrets}")
              if not any(m["mountPath"] == "/etc/fintechbankx/rds-ca" for m in c.get("volumeMounts", [])):
