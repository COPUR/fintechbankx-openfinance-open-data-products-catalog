            grep -qE "config location|is not allowed: a spring.config|APPLICATION_JSON is not allowed: it can redirect" override.err || { cat override.err; exit 1; }
          done
          printf 'config:\n  DB_URL: "%s"\nextraEnv:\n  - name: SPRING_CONFIG_IMPORT\n    value: "optional:file:/tmp/x.yaml"\n' "$url" > override-values.yaml
          if helm template ci "$chart" $common -f override-values.yaml > /dev/null 2> override.err; then
            echo "chart rendered with extraEnv SPRING_CONFIG_IMPORT"
            exit 1
          fi
          grep -qE "config location|extraEnv must not set SPRING_CONFIG_IMPORT" override.err || { cat override.err; exit 1; }
          rm -f override-values.yaml
