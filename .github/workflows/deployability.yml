          if len(crons) != 1 or not crons[0]["spec"].get("schedule"):
              fail("expected one scheduled history guard check CronJob")
          check_pod("CronJob", crons[0]["spec"]["jobTemplate"]["spec"]["template"])
          hooks = [d for d in docs if d["kind"] == "Job"]
          if break_glass:
              if hooks:
                  fail("a break-glass release must not render the release gate")
              if deploy["metadata"].get("annotations", {}).get("fintechbankx.io/history-guard-break-glass") != break_glass:
                  fail("a break-glass release must record its ticket on the Deployment")
          else:
              if len(hooks) != 1:
                  fail("expected one release-gate Job")
              ann = hooks[0]["metadata"].get("annotations", {})
              if ann.get("helm.sh/hook") != "pre-upgrade":
                  fail(f"the release gate must be a pre-upgrade hook only (the guard is armed after the first install), got {ann.get('helm.sh/hook')}")
              if hooks[0]["spec"].get("backoffLimit") != 0:
                  fail("the release gate must not retry")
              check_pod("release gate Job", hooks[0]["spec"]["template"])
          print("aws profile on every container; history guard check scheduled" + ("; release gate skipped for " + break_glass if break_glass else " and gating upgrades"))
          PY
          python3 guard-check.py rendered.yaml
          helm template ci "$chart" --set image.repository=ci/x --set image.tag=1 \
            --set externalSecret.remoteSecretName=ci/x/db-app --set externalSecret.migrationRemoteSecretName=ci/x/db-migration \
            --set 'config.DB_URL=jdbc:postgresql://ci/x?sslmode=verify-full&sslrootcert=/etc/fintechbankx/rds-ca/global-bundle.pem' \
            --set historyGuardCheck.breakGlassTicket=CHG-0001 > break-glass.yaml
          python3 guard-check.py break-glass.yaml CHG-0001
          rm -f guard-check.py break-glass.yaml
      - name: History guard check pods keep the mesh egress labels, and the CronJob is never suspended
        run: |
          # Mesh d2ccacc selects the check pods' Aurora egress on app.kubernetes.io/name and
          # app.kubernetes.io/component, so both stay on the CronJob's and the gate Job's pod templates.
          # The CronJob is never suspended: no spec.suspend is rendered and no value can set one.
          chart=deploy/helm/open-products-catalog-service
          common="--set image.repository=ci/x --set image.tag=1 --set externalSecret.remoteSecretName=ci/x/db-app --set externalSecret.migrationRemoteSecretName=ci/x/db-migration"
          common="$common --set config.DB_URL=jdbc:postgresql://ci/x?sslmode=verify-full&sslrootcert=/etc/fintechbankx/rds-ca/global-bundle.pem"
          for extra in "" "-f $chart/values-dev.yaml"; do
            helm template ci "$chart" $common $extra > history-guard-check.yaml
            python3 - history-guard-check.yaml <<'PY'
          import sys, yaml
          docs = [d for d in yaml.safe_load_all(open(sys.argv[1])) if d]
          want = {"app.kubernetes.io/name": "open-products-catalog-service",
                  "app.kubernetes.io/component": "history-guard-check"}
          cron = [d for d in docs if d["kind"] == "CronJob"]
          gate = [d for d in docs if d["kind"] == "Job" and d["metadata"]["name"].endswith("-history-guard-gate")]
          assert len(cron) == 1 and len(gate) == 1, f"expected one CronJob and one gate Job, got {len(cron)} and {len(gate)}"
          pods = {"CronJob": cron[0]["spec"]["jobTemplate"]["spec"]["template"], "gate Job": gate[0]["spec"]["template"]}
          for where, pod in pods.items():
              labels = pod["metadata"].get("labels") or {}
              for key, value in want.items():
                  assert labels.get(key) == value, f"{where} pod must carry {key}={value} (mesh egress selector), got {labels.get(key)!r}"
          assert cron[0]["spec"].get("suspend") in (None, False), f"CronJob must not be suspended, got suspend={cron[0]['spec'].get('suspend')!r}"
          print("history guard check pods carry name and component; CronJob not suspended")
          PY
          done
          if grep -rn "suspend" "$chart/templates" "$chart"/values*.yaml; then
            echo "no template or value may set the history guard CronJob's spec.suspend"; exit 1
          fi
          rm -f history-guard-check.yaml
      - name: Rendered ConfigMap has no empty or identity-provider keys
        run: |
          if grep -nE '^  OIDC_|: ""$' rendered.yaml; then
            echo "ConfigMap renders OIDC_* or empty values"
            exit 1
          fi

  terraform:
    name: deploy/terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - name: Plan-only tests with mocked providers (database access rules)
        run: terraform test

  data-migration:
    name: deploy/data-migration-rehearsal
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rehearsal
          POSTGRES_PASSWORD: rehearsal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rehearsal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: rehearsal
      PGPASSWORD: rehearsal
    steps:
      - uses: actions/checkout@v4
      - name: Rehearse schema migration, dev seed and idempotent catalogue import
        run: scripts/migration/verify-migration.sh
